# يبني برنامج مدار لسطح المكتب: ماك (.dmg) وويندوز (.exe)
# التشغيل: من تبويب Actions اختر "برنامج سطح المكتب" ثم Run workflow،
# أو ارفع وسم إصدار مثل v0.1.0 فينشئ مسودة Release فيها الملفات.
name: برنامج سطح المكتب

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: mac
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: windows
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من إعدادات Supabase
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            msg="أضف NEXT_PUBLIC_SUPABASE_URL و NEXT_PUBLIC_SUPABASE_ANON_KEY في Settings > Secrets and variables > Actions"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg"
            echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('مدار {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: madar-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
